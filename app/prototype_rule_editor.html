<!doctype html>
<!-- PROTOTYPE, throwaway: three rule-editor shapes for 自动化规则, switch with ?variant=A|B|C or ←/→. Not shipped. -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>规则编辑器原型</title>
<style>
:root{--bg:#fff;--panel:#f6f6f7;--card:#fff;--line:#e3e3e6;--text:#1c1c1e;--muted:#6e6e73;--accent:#3d6bf5;--accent-soft:#e8eefe;--warn:#b25b00;--warn-soft:#fff3e2;--ok:#1f8a4c;--ai:#7a4ce0;--ai-soft:#f1ebfd;--radius:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1c1e;--panel:#232326;--card:#2a2a2d;--line:#3a3a3e;--text:#f2f2f4;--muted:#9a9aa0;--accent:#6d8dff;--accent-soft:#26304d;--warn:#ffb35c;--warn-soft:#3d2c16;--ok:#4cc27c;--ai:#a988ff;--ai-soft:#30264a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px}
.side div{padding:6px 10px;border-radius:6px;color:var(--muted)}
.side .on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .gap{height:14px}
main{padding:24px 28px 110px;min-width:0}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 18px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.box h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:6px;padding:4px 10px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--panel);font-size:12px;color:var(--muted)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-ai{background:var(--ai-soft);color:var(--ai)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mail{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.mail:first-of-type{border-top:0}
.mail span:last-child{color:var(--muted);white-space:nowrap}
pre{margin:0;font:11px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--muted);max-height:220px;overflow:auto}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:8px}
/* A: vertical node cards */
.flow{display:flex;flex-direction:column;align-items:stretch;max-width:560px}
.node{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;position:relative}
.node .k{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.arrow{align-self:center;width:2px;height:22px;background:var(--line);position:relative}
.arrow:after{content:"";position:absolute;left:-4px;bottom:-2px;border:5px solid transparent;border-top-color:var(--line)}
.add{align-self:center;border-style:dashed;color:var(--muted)}
.cond{display:flex;gap:6px;align-items:center;margin:4px 0}
/* B: canvas */
.canvas{position:relative;height:520px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background-color:var(--panel);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.canvas svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cn{position:absolute;width:190px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;cursor:grab;user-select:none;box-shadow:0 1px 2px #0001}
.cn.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cn .k{font-size:10px;font-weight:700;color:var(--muted)}
.cn .v{font-size:13px;margin-top:2px}
.palette{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
/* C: sentence */
.sentence{font-size:17px;line-height:2.4}
.slot{display:inline-block;padding:0 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);cursor:pointer;line-height:1.8;margin:0 2px;border:1px solid transparent}
.slot:hover{border-color:var(--accent)}
.slot.add{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.pop{position:absolute;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 6px 20px #0002;min-width:200px}
.pop div{padding:5px 8px;border-radius:5px;cursor:pointer;font-size:13px}
.pop div:hover{background:var(--panel)}
.tpl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tpl button{font-size:12px}
/* switcher */
.sw{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#111;color:#fff;padding:8px 14px;border-radius:999px;box-shadow:0 6px 24px #0005;z-index:10;font-size:13px}
.sw button{background:#333;color:#fff;border:0;border-radius:999px;width:28px;height:28px;padding:0}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.wrap{grid-template-columns:1fr}main{padding:16px 16px 110px}}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div>通用</div><div>签名</div><div class="on">自动化</div><div>智能</div><div>标签</div><div>扩展</div><div>隐私</div><div>关于</div>
  </nav>
  <main>
    <h1>编辑规则</h1>
    <p class="sub" id="vsub"></p>
    <div class="tpl" id="tpl"></div>
    <div class="wrap">
      <div id="editor"></div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="box"><h3>预览：现有邮件中会命中</h3><div id="preview"></div></div>
        <div class="box"><h3>规则数据（原型状态）</h3><pre id="state"></pre></div>
      </div>
    </div>
  </main>
</div>
<div class="sw"><button id="prev" aria-label="上一个">←</button><span id="vlabel"></span><button id="next" aria-label="下一个">→</button></div>

<script>
const TRIGGERS={receive:'收到新邮件',label:'被打上标签',security:'安全判定为可疑',daily:'每天一次'};
const FIELDS={from:'发件人',to:'收件人',subject:'主题',attach:'有附件',label:'带有标签',folder:'所在文件夹',age:'早于（天）'};
const ACTIONS={
  label:{n:'打标签',arg:'标签',k:'local'},read:{n:'标为已读',k:'local'},star:{n:'加星标',k:'local'},
  archive:{n:'归档',k:'local'},junk:{n:'移到垃圾邮件',k:'local'},trash:{n:'移到废纸篓',k:'local'},
  forward:{n:'转发给',arg:'收件人',k:'egress'},
  export_pdf:{n:'导出 PDF 到',arg:'文件夹',k:'file'},export_att:{n:'保存附件到',arg:'文件夹',k:'file'},
  ai_draft:{n:'AI 起草回复',k:'ai'},ai_extract:{n:'AI 提取要点到',arg:'文件夹',k:'ai'},
  stop:{n:'不再执行后续规则',k:'local'}
};
const MAILS=[
  {from:'billing@aws.amazon.com',subject:'Your AWS invoice is available',attach:true,label:'账单',folder:'收件箱',age:3},
  {from:'noreply@github.com',subject:'[godwit] PR #434 opened',attach:false,label:'',folder:'收件箱',age:1},
  {from:'invoice@stripe.com',subject:'Invoice #1234 from Acme',attach:true,label:'账单',folder:'收件箱',age:12},
  {from:'news@substack.com',subject:'Weekly digest',attach:false,label:'订阅',folder:'收件箱',age:6},
  {from:'security@paypa1-alert.com',subject:'Verify your account now',attach:false,label:'',folder:'垃圾邮件',age:40},
  {from:'alice@example.com',subject:'Re: 合同附件',attach:true,label:'',folder:'收件箱',age:2},
  {from:'noreply@github.com',subject:'[godwit] CI failed on main',attach:false,label:'',folder:'废纸篓',age:45},
];
const TEMPLATES={
  '账单归档':{name:'账单归档',trigger:'receive',logic:'and',conds:[{f:'subject',v:'invoice'},{f:'attach',v:'是'}],actions:[{t:'label',v:'账单'},{t:'export_pdf',v:'~/Documents/账单'},{t:'archive'}]},
  '清空废纸篓（模板）':{name:'清空废纸篓',trigger:'daily',logic:'and',conds:[{f:'folder',v:'废纸篓'},{f:'age',v:'30'}],actions:[{t:'trash'}],note:'模板：不自动创建；“彻底清除”第一期不提供，这里用移到废纸篓占位'},
  '可疑邮件移到垃圾邮件（模板）':{name:'可疑邮件移到垃圾邮件',trigger:'security',logic:'and',conds:[],actions:[{t:'junk'}]},
  '转发给会计':{name:'转发给会计',trigger:'receive',logic:'and',conds:[{f:'from',v:'stripe.com'}],actions:[{t:'forward',v:'acct@example.com'},{t:'ai_draft'}]},
};
let rule=JSON.parse(JSON.stringify(TEMPLATES['账单归档']));
let sel=null; // A/B: selected node id

function matches(m){
  const test=c=>{const v=(c.v||'').toLowerCase();switch(c.f){
    case 'from':return m.from.includes(v);case 'to':return true;case 'subject':return m.subject.toLowerCase().includes(v);
    case 'attach':return m.attach===(c.v!=='否');case 'label':return m.label===c.v;case 'folder':return m.folder===c.v;
    case 'age':return m.age>Number(c.v||0);}return true};
  if(rule.trigger==='security'&&!m.from.includes('paypa1'))return false;
  if(!rule.conds.length)return true;
  return rule.logic==='or'?rule.conds.some(test):rule.conds.every(test);
}
function warnings(){
  const w=[];
  rule.actions.forEach(a=>{const k=ACTIONS[a.t].k;
    if(k==='egress')w.push(`保存时需确认：之后会自动转发到 <b>${a.v||'（未填）'}</b>（ADR 0003）`);
    if(k==='ai')w.push('会把命中邮件发给模型：默认关闭，需在「智能」里单独打开（ADR 0010）');
    if(k==='file')w.push(`会写入本机文件夹 ${a.v||'（未选）'}`);});
  if(rule.note)w.push(rule.note);
  return [...new Set(w)];
}
function renderSide(){
  const hits=MAILS.filter(matches);
  document.getElementById('preview').innerHTML=`<div class="note" style="margin:0 0 6px">${hits.length} / ${MAILS.length} 封</div>`+
    hits.map(m=>`<div class="mail"><span>${m.subject}</span><span>${m.folder}</span></div>`).join('')+
    warnings().map(x=>`<div class="warnbox">${x}</div>`).join('');
  document.getElementById('state').textContent=JSON.stringify(rule,null,1);
}
function opt(map,cur){return Object.entries(map).map(([k,v])=>`<option value="${k}"${k===cur?' selected':''}>${v.n||v}</option>`).join('')}
function kindChip(t){const k=ACTIONS[t].k;return k==='egress'?'<span class="chip tag-warn">外发</span>':k==='ai'?'<span class="chip tag-ai">AI</span>':k==='file'?'<span class="chip">写文件</span>':''}

/* ---------- A: vertical node cards ---------- */
function A(){
  const e=document.getElementById('editor');
  let h=`<div class="flow"><div class="node${sel==='t'?' sel':''}" data-n="t"><div class="k">当<span>触发</span></div>
    <select data-a="trigger">${opt(TRIGGERS,rule.trigger)}</select></div><div class="arrow"></div>
    <div class="node${sel==='c'?' sel':''}" data-n="c"><div class="k">如果<span><select data-a="logic"><option value="and"${rule.logic==='and'?' selected':''}>全部满足</option><option value="or"${rule.logic==='or'?' selected':''}>任一满足</option></select></span></div>`;
  if(!rule.conds.length)h+=`<div class="note">没有条件：所有触发的邮件都会执行</div>`;
  rule.conds.forEach((c,i)=>{h+=`<div class="cond"><select data-c="${i}" data-p="f">${opt(FIELDS,c.f)}</select><input data-c="${i}" data-p="v" value="${c.v||''}" size="14"><button class="ghost" data-delc="${i}">✕</button></div>`});
  h+=`<button class="ghost" data-addc>＋ 条件</button></div>`;
  rule.actions.forEach((a,i)=>{h+=`<div class="arrow"></div><div class="node${sel==='a'+i?' sel':''}" data-n="a${i}"><div class="k">${i?'然后':'就'}<span class="row">${kindChip(a.t)}<button class="ghost" data-up="${i}">↑</button><button class="ghost" data-dela="${i}">✕</button></span></div>
    <div class="row"><select data-ai="${i}" data-p="t">${opt(ACTIONS,a.t)}</select>${ACTIONS[a.t].arg?`<input data-ai="${i}" data-p="v" value="${a.v||''}" placeholder="${ACTIONS[a.t].arg}">`:''}</div></div>`});
  h+=`<div class="arrow"></div><button class="add" data-adda>＋ 添加动作</button>
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button>取消</button><button class="primary">保存并启用</button></div></div>`;
  e.innerHTML=h;
  e.onclick=ev=>{const t=ev.target,d=t.dataset;
    if(d.addc!==undefined){rule.conds.push({f:'from',v:''})}
    else if(d.delc){rule.conds.splice(+d.delc,1)}
    else if(d.adda!==undefined){rule.actions.push({t:'read'})}
    else if(d.dela){rule.actions.splice(+d.dela,1)}
    else if(d.up&&+d.up>0){const i=+d.up;[rule.actions[i-1],rule.actions[i]]=[rule.actions[i],rule.actions[i-1]]}
    else{const n=t.closest('[data-n]');if(n&&!['SELECT','INPUT','BUTTON'].includes(t.tagName))sel=n.dataset.n;else return}
    render()};
  e.onchange=e.oninput=ev=>{const t=ev.target,d=t.dataset;
    if(d.a)rule[d.a]=t.value;else if(d.c)rule.conds[+d.c][d.p]=t.value;else if(d.ai)rule.actions[+d.ai][d.p]=t.value;else return;
    if(ev.type==='change')render();else renderSide()};
}

/* ---------- B: free canvas ---------- */
let layout=null;
function initLayout(){
  layout={t:{x:150,y:30},c:{x:150,y:140}};
  rule.actions.forEach((a,i)=>layout['a'+i]={x:150+(i%2?110:-20),y:260+i*95});
}
function B(){
  if(!layout||Object.keys(layout).length!==2+rule.actions.length)initLayout();
  const e=document.getElementById('editor');
  const nodes=[['t','当',TRIGGERS[rule.trigger]],['c',rule.logic==='or'?'如果（任一）':'如果（全部）',rule.conds.map(c=>FIELDS[c.f]+' '+(c.v||'')).join(' · ')||'无条件'],
    ...rule.actions.map((a,i)=>['a'+i,i?'然后':'就',ACTIONS[a.t].n+(a.v?' '+a.v:'')])];
  const edges=[['t','c'],...rule.actions.map((a,i)=>[i?'a'+(i-1):'c','a'+i])];
  e.innerHTML=`<div class="canvas" id="cv"><svg id="sv"></svg><div class="palette"><button data-addn>＋ 动作节点</button><button data-tidy>整理布局</button></div>`+
    nodes.map(([id,k,v])=>`<div class="cn${sel===id?' sel':''}" data-id="${id}" style="left:${layout[id].x}px;top:${layout[id].y}px"><div class="k">${k} ${id[0]==='a'?kindChip(rule.actions[+id.slice(1)].t):''}</div><div class="v">${v}</div></div>`).join('')+
    `</div><div class="box" style="margin-top:12px"><h3>属性：${sel?nodes.find(n=>n[0]===sel)?.[1]||'':'点选一个节点'}</h3><div id="insp"></div></div>`;
  const draw=()=>{document.getElementById('sv').innerHTML=edges.map(([a,b])=>{const p=layout[a],q=layout[b];const x1=p.x+95,y1=p.y+52,x2=q.x+95,y2=q.y;return `<path d="M${x1},${y1} C${x1},${y1+40} ${x2},${y2-40} ${x2},${y2}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`}).join('')};
  draw();
  const insp=document.getElementById('insp');
  if(sel==='t')insp.innerHTML=`<select data-a="trigger">${opt(TRIGGERS,rule.trigger)}</select>`;
  else if(sel==='c')insp.innerHTML=`<select data-a="logic"><option value="and">全部满足</option><option value="or"${rule.logic==='or'?' selected':''}>任一满足</option></select>`+rule.conds.map((c,i)=>`<div class="cond"><select data-c="${i}" data-p="f">${opt(FIELDS,c.f)}</select><input data-c="${i}" data-p="v" value="${c.v||''}"></div>`).join('')+`<button class="ghost" data-addc>＋ 条件</button>`;
  else if(sel&&sel[0]==='a'){const i=+sel.slice(1),a=rule.actions[i];insp.innerHTML=`<div class="row"><select data-ai="${i}" data-p="t">${opt(ACTIONS,a.t)}</select>${ACTIONS[a.t].arg?`<input data-ai="${i}" data-p="v" value="${a.v||''}" placeholder="${ACTIONS[a.t].arg}">`:''}<button class="ghost" data-dela="${i}">删除节点</button></div>`}
  else insp.innerHTML='<div class="note">拖动节点改变位置；连线顺序就是执行顺序。原型里没做自由连线和分支，这正是画布要额外付出的成本。</div>';
  const cv=document.getElementById('cv');let drag=null;
  cv.onpointerdown=ev=>{const n=ev.target.closest('.cn');if(!n)return;const id=n.dataset.id;drag={id,dx:ev.clientX-layout[id].x,dy:ev.clientY-layout[id].y,moved:false};n.setPointerCapture(ev.pointerId)};
  cv.onpointermove=ev=>{if(!drag)return;drag.moved=true;const p=layout[drag.id];p.x=Math.max(0,ev.clientX-drag.dx);p.y=Math.max(0,ev.clientY-drag.dy);const n=cv.querySelector(`[data-id="${drag.id}"]`);n.style.left=p.x+'px';n.style.top=p.y+'px';draw()};
  cv.onpointerup=()=>{if(drag&&!drag.moved){sel=drag.id;render()}drag=null};
  e.onclick=ev=>{const d=ev.target.dataset;
    if(d.addn!==undefined){rule.actions.push({t:'read'});layout['a'+(rule.actions.length-1)]={x:300,y:400}}
    else if(d.tidy!==undefined){initLayout()}
    else if(d.addc!==undefined){rule.conds.push({f:'from',v:''})}
    else if(d.dela){rule.actions.splice(+d.dela,1);sel=null;layout=null}
    else return;render()};
  e.onchange=e.oninput=ev=>{const t=ev.target,d=t.dataset;
    if(d.a)rule[d.a]=t.value;else if(d.c)rule.conds[+d.c][d.p]=t.value;else if(d.ai)rule.actions[+d.ai][d.p]=t.value;else return;
    if(ev.type==='change')render();else renderSide()};
}

/* ---------- C: sentence builder ---------- */
function C(){
  const e=document.getElementById('editor');
  const condTxt=rule.conds.map((c,i)=>`<span class="slot" data-k="c${i}">${FIELDS[c.f]}${c.f==='attach'?'':' 包含 “'+(c.v||'…')+'”'}</span>`).join(rule.logic==='or'?' <span class="slot" data-k="logic">或</span> ':' <span class="slot" data-k="logic">且</span> ');
  e.innerHTML=`<div class="box"><div class="sentence">
    当 <span class="slot" data-k="t">${TRIGGERS[rule.trigger]}</span>
    ${rule.conds.length?'，如果 '+condTxt:''} <span class="slot add" data-k="addc">＋ 条件</span><br>
    就 ${rule.actions.map((a,i)=>`<span class="slot" data-k="a${i}">${ACTIONS[a.t].n}${a.v?' '+a.v:''}</span>${kindChip(a.t)}`).join('，然后 ')}
    <span class="slot add" data-k="adda">＋ 动作</span>。</div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button>取消</button><button class="primary">保存并启用</button></div></div>
    <div class="note">点任意蓝色词修改。整条规则读起来像一句话，没有单独的“节点”。</div>`;
  e.onclick=ev=>{const s=ev.target.closest('.slot');if(!s)return;popup(s,s.dataset.k)};
}
function popup(el,k){
  document.querySelector('.pop')?.remove();
  const r=el.getBoundingClientRect(),p=document.createElement('div');p.className='pop';
  p.style.left=(r.left+scrollX)+'px';p.style.top=(r.bottom+scrollY+4)+'px';
  let items=[];
  if(k==='t')items=Object.entries(TRIGGERS).map(([v,n])=>[n,()=>rule.trigger=v]);
  else if(k==='logic')items=[['且（全部满足）',()=>rule.logic='and'],['或（任一满足）',()=>rule.logic='or']];
  else if(k==='addc')items=Object.entries(FIELDS).map(([f,n])=>[n,()=>rule.conds.push({f,v:f==='attach'?'是':prompt(n+' 的值？')||''})]);
  else if(k==='adda')items=Object.entries(ACTIONS).map(([t,a])=>[a.n,()=>rule.actions.push({t,v:a.arg?prompt(a.arg+'？')||'':undefined})]);
  else if(k[0]==='c'){const i=+k.slice(1);items=[['改值…',()=>rule.conds[i].v=prompt('新的值？',rule.conds[i].v)??rule.conds[i].v],['删除这个条件',()=>rule.conds.splice(i,1)]]}
  else if(k[0]==='a'){const i=+k.slice(1);items=[...Object.entries(ACTIONS).map(([t,a])=>['改为：'+a.n,()=>rule.actions[i]={t,v:a.arg?prompt(a.arg+'？',rule.actions[i].v||'')||'':undefined}]),['前移',()=>{if(i)[rule.actions[i-1],rule.actions[i]]=[rule.actions[i],rule.actions[i-1]]}],['删除这个动作',()=>rule.actions.splice(i,1)]]}
  items.forEach(([n,f])=>{const d=document.createElement('div');d.textContent=n;d.onclick=()=>{f();p.remove();render()};p.appendChild(d)});
  document.body.appendChild(p);
  setTimeout(()=>document.addEventListener('click',function h(ev){if(!p.contains(ev.target)){p.remove();document.removeEventListener('click',h)}}),0);
}

/* ---------- switcher ---------- */
const V={A:['竖排节点卡片',A],B:['自由画布',B],C:['一句话规则',C]};
const SUB={A:'触发 → 条件 → 动作，各是一张卡片，箭头相连；可增删、排序，不可自由摆放。',B:'节点放在点阵画布上，可拖动；点节点在下方属性面板编辑。',C:'整条规则写成一句话，点词替换。'};
let cur=new URLSearchParams(location.search).get('variant');if(!V[cur])cur='A';
function render(){
  document.getElementById('vlabel').textContent=`${cur}（${V[cur][0]}）`;
  document.getElementById('vsub').textContent=SUB[cur];
  document.getElementById('tpl').innerHTML='<span class="note" style="margin:4px 4px 0 0">从模板开始：</span>'+Object.keys(TEMPLATES).map(n=>`<button data-tpl="${n}">${n}</button>`).join('');
  V[cur][1]();renderSide();
}
document.getElementById('tpl').onclick=ev=>{const n=ev.target.dataset.tpl;if(!n)return;rule=JSON.parse(JSON.stringify(TEMPLATES[n]));sel=null;layout=null;render()};
function go(d){const k=Object.keys(V);cur=k[(k.indexOf(cur)+d+k.length)%k.length];const u=new URL(location);u.searchParams.set('variant',cur);history.replaceState(null,'',u);sel=null;render()}
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);
addEventListener('keydown',ev=>{if(ev.target.closest('input,textarea,select,[contenteditable]'))return;if(ev.key==='ArrowLeft')go(-1);if(ev.key==='ArrowRight')go(1)});
render();
</script>
